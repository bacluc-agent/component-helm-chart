apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-instance-read-access
  namespace: test-merge-edge
rules:
  - apiGroups:
      - ''
    resources:
      - pods
      - secrets
      - configmaps
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-instance-read-access-binding
  namespace: test-merge-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-instance-read-access
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: coord-ops
