parameters:
  kapitan:
    dependencies:
      - type: helm
        source: ${helm_chart:charts:chart1:source}
        chart_name: ${helm_chart:charts:chart1:name}
        version: ${helm_chart:charts:chart1:version}
        output_path: ${_base_directory}/helmcharts/${helm_chart:charts:chart1:name}-${helm_chart:charts:chart1:version}
    compile:
      - input_paths:
          - ${_base_directory}/component/helm-values.jsonnet
        input_type: jsonnet
        output_path: ${_base_directory}/helmcharts
        output_type: json
      - input_paths:
          - ${_base_directory}/helmcharts/${helm_chart:charts:chart1:name}-${helm_chart:charts:chart1:version}
        input_type: helm
        output_path: ${_instance}/${helm_chart:charts:chart1:name}
        helm_values_files:
          - ${_base_directory}/helmcharts/merged-values-${_instance}.json
        helm_params:
          name: ${helm_chart:charts:chart1:name}
          namespace: ${helm_chart:namespace}
      - input_paths:
          - ${_base_directory}/component/app.jsonnet
        input_type: jsonnet
        output_path: .
      - input_paths:
          - ${_base_directory}/component/main.jsonnet
        input_type: jsonnet
        output_path: ${_instance}/${helm_chart:charts:chart1:name}
